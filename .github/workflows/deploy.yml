name: Deploy to new.mscorporation.top

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql, mbstring, fileinfo, dom
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test application
        run: |
          composer install --prefer-dist --no-interaction
          cp .env.example .env
          php artisan key:generate
          php artisan test --compact
      - name: Build production files
        run: |
          npm install --global pnpm@10
          pnpm install --frozen-lockfile
          pnpm run build
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
          mkdir -p release
          rsync -a app bootstrap config database public resources routes vendor artisan composer.json composer.lock release/ --exclude='bootstrap/cache/*.php' --exclude='public/hot' --exclude='public/storage'
      - name: Upload through encrypted FTP
        env:
          FTP_SERVER: ftp.mscorporation.top
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy_ftps.py
